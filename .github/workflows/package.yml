# Teste le dépôt puis publie une Release GitHub v<version> avec le zip du dépôt,
# une seule fois par version de plugins/project-bootstrap/.claude-plugin/plugin.json.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Tests
        run: bash tests/run.sh

      - name: Version du plugin
        id: version
        run: |
          version=$(jq -r .version plugins/project-bootstrap/.claude-plugin/plugin.json)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "existe=oui" >> "$GITHUB_OUTPUT"
            echo "La Release v$version existe déjà : incrémente la version pour en publier une nouvelle."
          fi

      # Fichiers suivis par git seulement, dans un dossier kateyer-plugins-<version>/ à l'intérieur du zip.
      - name: Zip et Release
        if: steps.version.outputs.existe != 'oui'
        run: |
          tag=${{ steps.version.outputs.tag }}
          git archive --format=zip --prefix="kateyer-plugins-${tag#v}/" -o "kateyer-plugins-${tag#v}.zip" HEAD
          gh release create "$tag" "kateyer-plugins-${tag#v}.zip" --target "$GITHUB_SHA" --title "kateyer-plugins $tag" --generate-notes
